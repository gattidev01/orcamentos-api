services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orcamentos
      POSTGRES_USER: orcamentos
      POSTGRES_PASSWORD: orcamentos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcamentos"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orcamentos
      DB_USER: orcamentos
      DB_PASSWORD: orcamentos
      JWT_SECRET: ${JWT_SECRET:-bXVkZS1lc3RlLXNlZ3JlZG8tZW0tcHJvZHVjYW8tMTIzNDU2}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
